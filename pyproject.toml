[project]
name = "passguard"
version = "1.0.0"
description = "Генератор, проверка надёжности и зашифрованное хранилище паролей на FastAPI"
requires-python = "==3.12.*"
# Те же версии, что в requirements.txt; отсюда зависимости берёт FastAPI Cloud
dependencies = [
    "fastapi[standard]==0.162.0",
    "SQLAlchemy==2.1.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "bcrypt==5.0.0",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
